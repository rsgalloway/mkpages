[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkpages"
version = "0.2.3"
description = "Generate Jekyll source trees from Markdown folder structures."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Ryan Galloway", email = "ryan@rsgalloway.com" }]
keywords = ["markdown", "jekyll", "static-site", "github-pages", "cli"]
dependencies = [
  'importlib_resources>=5.10; python_version < "3.9"',
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/rsgalloway/mkpages"
Repository = "https://github.com/rsgalloway/mkpages"
Issues = "https://github.com/rsgalloway/mkpages/issues"

[project.scripts]
mkpages = "mkpages.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "flake8==7.1.1",
  "mccabe==0.7.0",
  "isort==5.13.2",
  "black==24.8.0",
]
test = ["pytest"]

[tool.setuptools]
zip-safe = false
package-dir = {"" = "src"}

[tool.setuptools.package-data]
mkpages = ["themes/*.css", "templates/*.j2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tmp"]
